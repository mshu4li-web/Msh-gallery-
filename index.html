<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msh Studio | معرض اللوحات</title>
    <!-- خط ألكسندريا (البديل المجاني والأقرب لطابع خط ثمانية) -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #070707; 
            color: #fff; 
            font-family: 'Alexandria', sans-serif; 
        }
        header { 
            text-align: center; 
            padding: 8vh 20px 4vh; 
            background: linear-gradient(180deg, #151515 0%, #070707 100%); 
            border-bottom: 1px solid #222; 
        }
        .logo {
            max-width: 220px; /* يمكنك تكبير أو تصغير الشعار بتغيير هذا الرقم */
            height: auto;
            margin-bottom: 15px;
        }
        header p { 
            color: #999; 
            font-size: 1.1rem; 
            margin-top: 10px; 
            font-weight: 300; 
        }
        .gallery { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px; 
            padding: 60px 20px; 
            max-width: 1100px; 
            margin: auto; 
        }
        .card { 
            flex: 1 1 350px;
            max-width: 500px;
            background: #111; 
            border: 1px solid #222; 
            border-radius: 16px; 
            overflow: hidden; 
            transition: all 0.4s ease; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .card:hover { 
            transform: translateY(-10px); 
            border-color: #444; 
            box-shadow: 0 15px 40px rgba(255,255,255,0.05); 
        }
        .img-container { 
            width: 100%; 
            height: 350px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000;
        }
        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        .card:hover .img-container img { 
            transform: scale(1.08); 
        }
        .info { 
            padding: 25px; 
            text-align: center; 
        }
        .info h3 { 
            margin: 0 0 15px 0; 
            font-size: 1.4rem; 
            color: #f5f5f5; 
        }
        .btn { 
            display: inline-block; 
            padding: 10px 30px; 
            background: #fff; 
            color: #000; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: 700; 
            transition: 0.3s; 
        }
        .btn:hover { 
            background: #d4d4d4; 
            transform: scale(1.05); 
        }
        .wa-float { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: #25D366; 
            color: #fff; 
            padding: 15px 25px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.1rem; 
            box-shadow: 0 10px 20px rgba(37,211,102,0.3); 
            transition: 0.3s; 
            z-index: 100;
        }
        .wa-float:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 25px rgba(37,211,102,0.5); 
        }
    </style>
</head>
<body>

    <header>
        <!-- صورة الشعار بدلاً من النص -->
        <img src="logo.png" alt="شعار Msh Studio" class="logo">
        <p></p>
    </header>

    <div class="gallery">
        <!-- اللوحة الأولى -->
        <div class="card">
            <div class="img-container">
                <!-- تم الاعتماد على الاسم المبسط 1.jpg لتجنب أي مشاكل -->
                <img src="1.jpg" alt="اللوحة الأولى">
            </div>
            <div class="info">
                <h3>الفيصل</h3>
                <a href="https://api.whatsapp.com/send?phone=966555713188&text=أهلاً، أرغب بطلب اللوحة الأولى" class="btn" target="_blank">اطلب الآن</a>
            </div>
        </div>

        <!-- اللوحة الثانية -->
        <div class="card">
            <div class="img-container">
                <!-- تم الاعتماد على الاسم المبسط 2.jpg -->
                <img src="2.jpg" alt="اللوحة الثانية">
            </div>
            <div class="info">
                <h3>حُـب</h3>
                <a href="https://api.whatsapp.com/send?phone=966555713188&text=أهلاً، أرغب بطلب اللوحة الثانية" class="btn" target="_blank">اطلب الآن</a>
            </div>
        </div>
    </div>

    <!-- زر الواتساب -->
    <a href="https://api.whatsapp.com/send?phone=966555713188X&text=أهلاً بك، لدي استفسار" class="wa-float" target="_blank">
        💬 تواصل معنا
    </a>

</body>
</html>
