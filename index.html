<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msh Studio | معرض اللوحات</title>
    <!-- استدعاء خط احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* التصميم الفاخر */
        body { 
            margin: 0; 
            background-color: #070707; 
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
        }
        header { 
            text-align: center; 
            padding: 10vh 20px; 
            background: linear-gradient(180deg, #151515 0%, #070707 100%); 
            border-bottom: 1px solid #222; 
        }
        header h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            font-weight: 700; 
            letter-spacing: 2px;
            background: -webkit-linear-gradient(#ffffff, #777777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { 
            color: #999; 
            font-size: 1.2rem; 
            margin-top: 10px; 
            font-weight: 300; 
        }
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 40px; 
            padding: 60px 20px; 
            max-width: 1100px; 
            margin: auto; 
        }
        .card { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 16px; 
            overflow: hidden; 
            transition: all 0.4s ease; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .card:hover { 
            transform: translateY(-10px); 
            border-color: #444; 
            box-shadow: 0 15px 40px rgba(255,255,255,0.05); 
        }
        .img-container { 
            width: 100%; 
            height: 350px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000;
        }
        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        .card:hover .img-container img { 
            transform: scale(1.08); 
        }
        .info { 
            padding: 25px; 
            text-align: center; 
        }
        .info h3 { 
            margin: 0 0 15px 0; 
            font-size: 1.4rem; 
            color: #f5f5f5; 
        }
        .btn { 
            display: inline-block; 
            padding: 10px 30px; 
            background: #fff; 
            color: #000; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: 700; 
            transition: 0.3s; 
        }
        .btn:hover { 
            background: #d4d4d4; 
            transform: scale(1.05); 
        }
        .wa-float { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: #25D366; 
            color: #fff; 
            padding: 15px 25px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.1rem; 
            box-shadow: 0 10px 20px rgba(37,211,102,0.3); 
            transition: 0.3s; 
            z-index: 100;
        }
        .wa-float:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 25px rgba(37,211,102,0.5); 
        }
    </style>
</head>
<body>

    <header>
        <h1>Msh Studio</h1>
        <p>فن يجسد الخيال — تصفح اللوحات واطلب نسختك الآن</p>
    </header>

    <div class="gallery">
        <!-- اللوحة الأولى -->
        <div class="card">
            <div class="img-container">
                <!-- تم وضع الامتداد .jpeg بالظبط كما في ملفاتك -->
                <img src="اللوحة الأولى.jpeg" alt="اللوحة الأولى">
            </div>
            <div class="info">
                <h3>الفيصل</h3>
                <a href="https://api.whatsapp.com/send?phone=966XXXXXXXXX&text=أهلاً، أرغب بطلب اللوحة الأولى" class="btn" target="_blank">اطلب الآن</a>
            </div>
        </div>

        <!-- اللوحة الثانية -->
        <div class="card">
            <div class="img-container">
                <!-- تم وضع الامتداد .jpg بالظبط كما في ملفاتك -->
                <img src="اللوحة الثانية.jpg" alt="اللوحة الثانية">
            </div>
            <div class="info">
                <h3>حُب</h3>
                <a href="https://api.whatsapp.com/send?phone=966555713188&text=أهلاً، أرغب بطلب اللوحة الثانية" class="btn" target="_blank">اطلب الآن</a>
            </div>
        </div>
    </div>

    <!-- زر الواتساب -->
    <a href="https://api.whatsapp.com/send?phone=966555713188&text=أهلاً بك Msh Studio، لدي استفسار" class="wa-float" target="_blank">
        💬 تواصل معنا
    </a>

</body>
</html>
