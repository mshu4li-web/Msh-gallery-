<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msh Studio | معرض اللوحات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #f5f5f5; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        header { text-align: center; padding: 50px 20px; border-bottom: 1px solid #333; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; margin: 0; font-weight: 700; }
        header p { color: #aaa; font-size: 1.2rem; margin-top: 10px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .art-piece { background: #111; padding: 15px; border-radius: 8px; text-align: center; transition: transform 0.3s ease; }
        .art-piece:hover { transform: scale(1.02); }
        .art-piece img { width: 100%; border-radius: 5px; margin-bottom: 15px; }
        .art-piece h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .order-btn { display: inline-block; background-color: #f5f5f5; color: #0a0a0a; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s ease; }
        .order-btn:hover { background-color: #ccc; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background-color: #25D366; color: white; border-radius: 50px; padding: 15px 25px; text-decoration: none; font-weight: bold; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
        .whatsapp-float:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <header>
        <h1>Msh Studio</h1>
        <p>فن يجسد الخيال — تصفح لوحاتي واطلب نسختك الآن</p>
    </header>
    <div class="gallery">
        <div class="art-piece">
            <!-- تم تحديث اسم الصورة هنا تلقائياً -->
            <img src="اللوحة الأولى.jpeg" alt="اسم اللوحة">
            <h3>اسم اللوحة الأولى</h3>
            <a href="https://api.whatsapp.com/send?phone=966XXXXXXXXX&text=أهلاً، أرغب بطلب اللوحة الأولى" class="order-btn" target="_blank">طلب اللوحة</a>
        </div>
        <div class="art-piece">
            <!-- تم تحديث اسم الصورة هنا تلقائياً -->
            <img src="اللوحة الثانية.jpg" alt="اسم اللوحة">
            <h3>اسم اللوحة الثانية</h3>
            <a href="https://api.whatsapp.com/send?phone=966555713188&text=أهلاً، أرغب بطلب اللوحة الثانية" class="order-btn" target="_blank">طلب اللوحة</a>
        </div>
    </div>
    <a href="https://api.whatsapp.com/send?phone=966XXXXXXXXX&text=أهلاً بك Msh Studio، لدي استفسار" class="whatsapp-float" target="_blank">💬 تواصل واتساب</a>
</body>
</html>
